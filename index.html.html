const $=s=>document.querySelector(s), app=$('#app');
const state={screen:'cover',sound:true,players:1,completed:new Set(),house:3,selected:0,values:[],phase:'windows',exercise:0,queue:[],index:0,scores:[0,0],answer:'',locked:false,trainingErrors:0};

let audioCtx,anim=0;function tone(){if(!state.sound)return;try{audioCtx??=new(window.AudioContext||window.webkitAudioContext)();audioCtx.resume();let o=audioCtx.createOscillator(),g=audioCtx.createGain();o.type='sine';o.frequency.setValueAtTime(620,audioCtx.currentTime);o.frequency.exponentialRampToValueAtTime(930,audioCtx.currentTime+.06);g.gain.setValueAtTime(.055,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.001,audioCtx.currentTime+.11);o.connect(g);g.connect(audioCtx.destination);o.start();o.stop(audioCtx.currentTime+.12)}catch(e){}}
function resize(){let s=Math.min(innerWidth/1600,innerHeight/900),el=$('#stage');el.style.transform=`scale(${s})`;el.style.left=(innerWidth-1600*s)/2+'px';el.style.top=(innerHeight-900*s)/2+'px'}addEventListener('resize',resize);resize();
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function pairs(n){return Array.from({length:Math.floor(n/2)},(_,i)=>[n-1-i,i+1])}
function pool(only){let out=[],seen=new Set();for(let n=3;n<=10;n++){if(only&&n!==only)continue;for(let a=1;a<n;a++){let b=n-a;for(let q of [{text:`${a} + ${b}`,answer:n},{text:`${n} − ${a}`,answer:b}])if(!seen.has(q.text)){seen.add(q.text);out.push({...q,house:n})}}}return out}
function trainingCount(n){return n>=6?8:4}
function trainQueue(n){let p=pool(n),half=trainingCount(n)/2;return shuffle([...shuffle(p.filter(q=>q.text.includes('+'))).slice(0,half),...shuffle(p.filter(q=>q.text.includes('−'))).slice(0,half)])}
function gameQueue(){let all=[];for(let n=3;n<=10;n++){let p=pool(n),a=shuffle(p.filter(q=>q.text.includes('+')))[0],b=shuffle(p.filter(q=>q.text.includes('−')))[0];all.push(a,b,shuffle(p.filter(q=>q.text!==a.text&&q.text!==b.text))[0])}return shuffle(all)}
function mini(n){let rows=pairs(n),h=85+rows.length*44;return `<svg class="mini-house" viewBox="0 0 150 ${h}" aria-hidden="true"><path d="M5 70 L75 5 L145 70Z" fill="#edf5fc" stroke="#215eac" stroke-width="2.5"/><text x="75" y="55" text-anchor="middle" fill="#215eac" font-size="35" font-family="Arial" font-weight="bold">${n}</text>${rows.map(([a,b],i)=>`<rect x="12" y="${70+i*44}" width="126" height="44" fill="white" stroke="#215eac" stroke-width="2"/><path d="M75 ${70+i*44}v44" stroke="#215eac" stroke-width="2"/><text x="43" y="${101+i*44}" text-anchor="middle" font-family="Arial" font-size="27" fill="#163c56">${a}</text><text x="106" y="${101+i*44}" text-anchor="middle" font-family="Arial" font-size="27" fill="#163c56">${b}</text>`).join('')}</svg>`}
function pixelHeart(earned=true){return `<svg class="pixel-heart ${earned?'earned':'empty'}" viewBox="0 0 7 7" shape-rendering="crispEdges" aria-hidden="true"><path d="M1 0H3V1H4V0H6V1H7V4H6V5H5V6H4V7H3V6H2V5H1V4H0V1H1Z" fill="${earned?'#dc4154':'#d5dfe9'}"/>${earned?'<path d="M1 1H2V2H1Z" fill="#ffd3d6"/>':''}</svg>`}
function hearts(score,total){return `<div class="hearts" role="img" aria-label="${score} из ${total}">${Array.from({length:total},(_,i)=>pixelHeart(i<score)).join('')}</div>`}
function header(){return `<header><div class="brand">Домики чисел · Лампуша</div>${state.screen!=='cover'?'<button data-action="home" aria-label="На главную">⌂ На главную</button>':''}<button data-action="sound" aria-label="Звук">${state.sound?'Звук: вкл.':'Звук: выкл.'}</button><button data-action="full" aria-label="На весь экран">⛶</button></header>`}
function keys(){return `<div class="keypad">${[1,2,3,4,5,6,7,8,9].map(x=>`<button data-digit="${x}" ${state.locked?'disabled':''}>${x}</button>`).join('')}<button data-action="clear" aria-label="Стереть">⌫</button><button data-digit="0" ${state.locked?'disabled':''}>0</button><button data-action="erase" aria-label="Очистить">×</button><button class="enter" data-action="submit" ${state.locked?'disabled':''}>Проверить ↵</button><button data-action="next" aria-label="Дальше">→</button></div>`}
function render(){let html='';if(state.screen==='cover'){html=`<div class="cover"><div><div class="eyebrow">Состав чисел от 3 до 10</div><h1>Домики<br>чисел</h1><p>Вспоминаем состав чисел,<br>складываем и вычитаем вместе с Лампушей.</p><div class="row"><span class="pill">1 или 2 игрока</span><span class="pill">24 хода в игре</span></div><div class="actions"><button class="primary" data-action="training">Тренировка</button><button class="secondary" data-action="setup">Играть</button></div><div class="signature"><a href="https://vk.ru/club233505839" target="_blank" rel="noopener noreferrer">Мысли игропедагога | Светлана Иванова</a></div></div><div class="art" role="img" aria-label="Лампуша строит домик из кубиков"></div></div>`}
if(state.screen==='select'){html=`<div class="home-top"><div><div class="eyebrow">Тренировка</div><h2>Выбери числовой домик</h2><p>Заполни окошки и реши примеры: 3–5 — по 4, 6–10 — по 8.</p></div><span class="badge">Готово: ${state.completed.size} из 8</span></div><div class="grid">${Array.from({length:8},(_,i)=>i+3).map(n=>`<button class="house-choice" data-house="${n}" aria-label="Тренировать состав числа ${n}">${state.completed.has(n)?'<span class="done">✓ Готово</span>':''}${mini(n)}</button>`).join('')}</div><div class="small-note">Нажми на домик. Можно возвращаться к любому числу и тренироваться снова.</div>`}
if(state.screen==='training'){let rows=pairs(state.house);html=`<div class="row between"><div><div class="eyebrow">Тренировка · домик ${state.house}</div><h2>${state.phase==='windows'?'Кто живёт в пустых окошках?':'Закрепим состав числа'}</h2></div><button class="secondary" data-action="select">К домикам</button></div><div class="train-layout"><div class="house-area"><div class="house"><div class="roof"><svg viewBox="0 0 390 110"><path d="M5 107L195 4L385 107Z" fill="#edf5fc" stroke="#215eac" stroke-width="3"/></svg><span>${state.house}</span></div><div class="floors">${rows.map(([a,b],i)=>{let hidden=i%2;return `<div class="floor">${[a,b].map((v,j)=>`<div class="window">${j===hidden?`<button class="blank ${state.selected===i&&state.phase==='windows'?'selected':''} ${state.phase==='examples'?'good':''}" data-window="${i}" aria-label="Пустое окно, этаж ${i+1}">${state.values[i]??''}</button>`:v}</div>`).join('')}</div>`}).join('')}</div></div></div><div class="panel">${state.phase==='windows'?'<p style="text-align:center">Выбери окошко и впиши число.<br>Сумма на этаже равна числу на крыше.</p>':`<div class="task-mini">Пример ${state.exercise+1} из ${state.queue.length}</div><div class="question">${state.queue[state.exercise].text} =<span class="answer">${state.answer||'?'}</span></div>`}${keys()}<div class="feedback" role="status" aria-live="polite">${state.message||' '}</div></div></div>`}
if(state.screen==='setup'){html=`<div class="setup"><div><div class="eyebrow">Игра · 24 хода</div><h1>Кто строит<br>сегодня?</h1><p>Примеры на сложение и вычитание<br>будут появляться вперемешку.</p><div class="options"><button class="option ${state.players===1?'selected':''}" data-players="1">Один игрок</button><button class="option ${state.players===2?'selected':''}" data-players="2">Два игрока</button></div><p class="small-note">${state.players===2?'Каждый ответ завершает ход.<br>Игроки отвечают по очереди — по 12 ходов.':'За каждый верный ответ — красное сердечко.<br>Всего 24 разных примера.'}</p><div class="actions"><button class="primary" data-action="start">Начать игру →</button></div></div><div class="setup-art" role="img" aria-label="Лампуша строит домик"></div></div>`}
if(state.screen==='game'){let player=state.index%state.players,q=state.queue[state.index];html=`<div class="row between"><div><div class="eyebrow">Игра</div><h2>Ход ${state.index+1} из 24</h2></div><div class="scores">${state.scores.slice(0,state.players).map((s,i)=>`<div class="score ${player===i?'active':''}">${state.players===2?`<div class="score-label">Игрок ${i+1}</div>`:''}${hearts(s,24/state.players)}</div>`).join('')}</div></div><div class="progress"><i style="width:${state.index/24*100}%"></i></div><div class="game-grid"><div class="game-card"><div class="task-mini">${state.players===2?'Сейчас отвечает игрок '+(player+1):'Найди значение выражения'}</div><div class="question">${q.text} = <span class="answer">${state.answer||'?'}</span></div><div class="feedback" role="status" aria-live="polite">${state.message||' '}</div>${state.locked?`<button class="next-small" data-action="next">${state.index===23?'Итоги':'Дальше →'}</button>`:'<p style="text-align:center">Введи ответ и нажми «Проверить».</p>'}</div><div class="panel">${keys()}<div class="subtle" style="text-align:center">Можно отвечать с клавиатуры</div></div></div>`}
if(state.screen==='final'){let pr=praise[state.praise];html=`<div class="final"><div class="final-art" role="img" aria-label="Лампуша с готовым домиком"></div><div><div class="eyebrow">${state.finalType==='training'?'Тренировка завершена':'24 хода позади'}</div><h1>${pr[0]}</h1><p>${pr[1]}</p><div class="result">${state.result}</div><div class="actions">${state.finalType==='training'?'<button class="primary" data-action="select">Выбрать следующий домик →</button>':'<button class="primary" data-action="start">Играть ещё</button><button class="secondary" data-action="setup">Выбрать игроков</button>'}</div>${state.finalType==='training'&&state.completed.size===8?'<p class="completion">Все восемь домиков готовы!</p>':''}</div></div>`}
app.innerHTML=header()+`<main>${html}</main>`;}
function openHouse(n){Object.assign(state,{screen:'training',house:n,phase:'windows',selected:0,values:pairs(n).map(()=>''),queue:trainQueue(n),exercise:0,answer:'',locked:false,message:'',trainingErrors:0});render()}
function start(){Object.assign(state,{screen:'game',queue:gameQueue(),index:0,scores:[0,0],answer:'',locked:false,message:''});render()}
function digit(v){if(state.locked)return;if(state.screen==='training'&&state.phase==='windows'){let old=state.values[state.selected]||'';state.values[state.selected]=old.length<2?(old==='0'?'':old)+v:v}else if(state.screen==='game'||state.screen==='training'){state.answer=state.answer.length<2?(state.answer==='0'?'':state.answer)+v:v}else return;state.message='';render()}
function clear(all){if(state.locked)return;if(state.screen==='training'&&state.phase==='windows'){let v=state.values[state.selected]||'';state.values[state.selected]=all?'':v.slice(0,-1)}else state.answer=all?'':state.answer.slice(0,-1);state.message='';render()}
function submit(){if(state.locked)return;tone();if(state.screen==='training'&&state.phase==='windows'){let ps=pairs(state.house),i=state.selected,v=state.values[i];if(v===''){state.message='Введи число в выделенное окошко.';render();return}if(+v!==ps[i][i%2]){state.trainingErrors++;state.message='Подумай ещё: сколько не хватает до '+state.house+'?';render();return}let nextI=state.values.findIndex((v,j)=>v===''||+v!==ps[j][j%2]);if(nextI===-1){state.phase='examples';state.answer='';state.message='Все окошки заполнены верно! '+pixelHeart()}else{state.selected=nextI;state.message='Верно! '+pixelHeart()+' Заполни следующее окошко.'}render();return}
if(state.screen!=='training'&&state.screen!=='game')return;if(!state.answer){state.message='Сначала введи ответ.';render();return}let q=state.screen==='game'?state.queue[state.index]:state.queue[state.exercise],ok=+state.answer===q.answer;if(state.screen==='game'){if(ok)state.scores[state.index%state.players]++;state.locked=true;state.message=ok?'Верно! '+pixelHeart():'Правильный ответ: '+q.answer;render()}else if(ok){state.exercise++;state.answer='';state.message='Верно! '+pixelHeart();if(state.exercise===state.queue.length){state.completed.add(state.house);finish('training')}else render()}else{state.trainingErrors++;state.message='Попробуй ещё раз. Посмотри на домик.';render()}}
function next(){if(state.screen==='game'&&state.locked){if(state.index===23)finish('game');else{state.index++;state.answer='';state.message='';state.locked=false;render()}}else if(state.screen==='training'&&state.phase==='windows'){state.selected=(state.selected+1)%state.values.length;render()}}
function finish(type){state.finalType=type;state.praise=Math.floor(Math.random()*10);if(type==='training')state.result=`Домик ${state.house}: все окошки и примеры (${state.queue.length}) решены!`;else if(state.players===1)state.result=`Собрано сердечек: ${state.scores[0]} из 24${hearts(state.scores[0],24)}`;else{let[a,b]=state.scores;state.result=`Игрок 1: ${a} из 12${hearts(a,12)}Игрок 2: ${b} из 12${hearts(b,12)}${a===b?'Ничья! Отличная командная работа.':'Победил игрок '+(a>b?1:2)+'!'}`}state.screen='final';state.locked=false;render();fireworks()}
function fireworks(){cancelAnimationFrame(anim);let ctx=$('#confetti').getContext('2d'),parts=[],colors=['#13959a','#efba53','#79b49a','#d78b77'];for(let k=0;k<5;k++){let x=180+Math.random()*1240,y=100+Math.random()*330;for(let j=0;j<36;j++){let a=Math.random()*Math.PI*2,s=2+Math.random()*7;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:70+Math.random()*50,c:colors[j%4]})}}function frame(){ctx.clearRect(0,0,1600,900);if(state.screen!=='final')return;for(let p of parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.045;p.life--;ctx.globalAlpha=Math.max(0,Math.min(1,p.life/40));ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,5,8)}ctx.globalAlpha=1;parts=parts.filter(p=>p.life>0);if(parts.length)anim=requestAnimationFrame(frame);else ctx.clearRect(0,0,1600,900)}frame()}
app.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.digit!==undefined){digit(b.dataset.digit);return}if(b.dataset.house){openHouse(+b.dataset.house);return}if(b.dataset.window!==undefined){if(state.phase==='windows'){state.selected=+b.dataset.window;state.message='';render()}return}if(b.dataset.players){state.players=+b.dataset.players;render();return}let a=b.dataset.action;if(a==='sound'){state.sound=!state.sound;render()}if(a==='full'){if(document.fullscreenElement)document.exitFullscreen?.();else document.documentElement.requestFullscreen?.().catch(()=>{})}if(a==='home'){state.screen='cover';state.message='';render()}if(a==='training'||a==='select'){state.screen='select';state.message='';render()}if(a==='setup'){state.screen='setup';render()}if(a==='start')start();if(a==='clear')clear(false);if(a==='erase')clear(true);if(a==='submit')submit();if(a==='next')next()});
addEventListener('keydown',e=>{if(e.repeat){e.preventDefault();return}if(!['training','game'].includes(state.screen))return;if(/^\d$/.test(e.key)){e.preventDefault();digit(e.key)}if(e.key==='Backspace'){e.preventDefault();clear(false)}if(e.key==='Delete'){e.preventDefault();clear(true)}if(e.key==='Enter'){e.preventDefault();submit()}});render();
</script></body></html>
